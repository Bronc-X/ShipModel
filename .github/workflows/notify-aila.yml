name: Notify aila

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch ShipModel update
    runs-on: ubuntu-latest

    steps:
      - name: Notify aila repository
        env:
          AILA_DISPATCH_TOKEN: ${{ secrets.AILA_DISPATCH_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$AILA_DISPATCH_TOKEN" ]; then
            echo "AILA_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AILA_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Bronc-X/aila/dispatches \
            -d "$(jq -n \
              --arg event_type "shipmodel-updated" \
              --arg sha "$COMMIT_SHA" \
              --arg branch "$BRANCH" \
              --arg repo "$REPOSITORY" \
              --arg repo_url "$REPOSITORY_URL" \
              '{event_type: $event_type, client_payload: {sha: $sha, branch: $branch, repo: $repo, repo_url: $repo_url}}')"

